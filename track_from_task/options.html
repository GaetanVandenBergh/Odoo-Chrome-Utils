<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Host Settings</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link href="options.css" rel="stylesheet" />
    </head>
    <body>
        <div class="container-fluid p-4">
            <div class="row">
                <div class="col-md-3">
                    <h4>Hosts</h4>

                    <div class="input-group mb-3">
                        <input id="newHost" class="form-control" placeholder="www.odoo.com" />
                        <button type="button" id="addHostBtn" class="btn btn-primary">Add</button>
                    </div>

                    <div id="hostList" class="list-group"></div>
                </div>

                <div class="col-md-9">
                    <div id="editor" class="d-none">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 id="hostTitle"></h4>

                            <div class="btn-group">
                                <button
                                    type="button"
                                    id="exportHostBtn"
                                    class="btn btn-outline-secondary"
                                >
                                    Export
                                </button>
                                <button
                                    type="button"
                                    id="importHostBtn"
                                    class="btn btn-outline-secondary"
                                >
                                    Import
                                </button>
                                <button
                                    type="button"
                                    id="importNewHostBtn"
                                    class="btn btn-outline-secondary"
                                >
                                    Import As New
                                </button>
                                <button type="button" id="deleteHostBtn" class="btn btn-danger">Delete Host</button>
                            </div>
                        </div>

                        <input type="file" id="importFile" accept=".json" hidden />

                        <div class="row mb-4">
                            <div class="col-md-4">
                                <label for="stageInput" class="form-label">Stage</label>
                                <input id="stageInput" type="number" min="0" step="1" class="form-control" />
                            </div>
                            <div class="col-md-4">
                                <label for="trackCreatedTagInput" class="form-label">Track Created Tag</label>
                                <input id="trackCreatedTagInput" type="number" min="1" step="1" class="form-control" />
                            </div>
                        </div>

                        <h5>Task Tag → Duration</h5>

                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>Task Tag ID</th>
                                    <th>Duration</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="durationTagTable"></tbody>
                        </table>

                        <button type="button" id="addDurationTagBtn" class="btn btn-outline-primary mb-4">
                            Add Duration Mapping
                        </button>

                        <h5>Title Tag → Event Tag Mapping</h5>

                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>Regex</th>
                                    <th>Event Tag ID</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="titleTagTable"></tbody>
                        </table>

                        <button type="button" id="addTitleTagBtn" class="btn btn-outline-primary mb-4">
                            Add Title Tag Mapping
                        </button>

                        <h5>Description Skip Patterns</h5>

                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>Regex</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="descriptionSkipTable"></tbody>
                        </table>

                        <button type="button" id="addDescriptionSkipBtn" class="btn btn-outline-primary mb-4">
                            Add Description Skip Pattern
                        </button>

                        <h5>Project → Event Mapping</h5>

                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>Project ID</th>
                                    <th>Event ID</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="projectTable"></tbody>
                        </table>

                        <button
                            type="button"
                            id="addProjectBtn"
                            class="btn btn-outline-primary mb-4"
                        >
                            Add Project
                        </button>

                        <h5>Task Tag → Event Tag Mapping</h5>

                        <table class="table table-sm">
                            <thead>
                                <tr>
                                    <th>Task Tag ID</th>
                                    <th>Event Tag ID</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="taskTagTable"></tbody>
                        </table>

                        <button type="button" id="addTaskTagBtn" class="btn btn-outline-primary mb-4">
                            Add Task Tag Mapping
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <script src="options.js"></script>
    </body>
</html>
